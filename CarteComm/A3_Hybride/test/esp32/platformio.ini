; Essais radio LoRa sur ESP32 — deux environnements, un par sens.
;
;   pio run -e tx -t upload -t monitor     émission + attente d'accusé
;   pio run -e rx -t upload -t monitor     écoute + accusé
;
; Les deux essais utilisent le PILOTE DU PROJET (`Sx1276Radio`) et la TRAME DU
; PROJET, pas une bibliothèque tierce. C'est ce qui leur donne leur valeur :
; ils éprouvent le code qui partira en production, et ils interopèrent avec
; ../unipi/ qui parle la même trame.
;
; Ce dossier est AUTONOME : toutes les sources ci-dessous lui appartiennent.
; Les essais compilent le pilote et la trame du projet, pas une bibliothèque
; tierce — c'est ce qui leur donne leur valeur.
[env]
platform = espressif32
board = esp32dev
framework = espidf
monitor_speed = 115200
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -I include
    -I ../../firmware/common
build_unflags = -std=gnu++11

[env:tx]
build_src_filter =
    +<test_tx.cpp>
    +<../../../firmware/common/platform/esp32/sx1276_radio.cpp>
    +<../../../firmware/common/transport/duty_cycle.cpp>
    +<../../../firmware/common/platform/esp32/esp_ports.cpp>
    +<../../../firmware/common/proto/frame.cpp>
    +<../../../firmware/common/proto/crc16.cpp>

[env:rx]
build_src_filter =
    +<test_rx.cpp>
    +<../../../firmware/common/platform/esp32/sx1276_radio.cpp>
    +<../../../firmware/common/transport/duty_cycle.cpp>
    +<../../../firmware/common/platform/esp32/esp_ports.cpp>
    +<../../../firmware/common/proto/frame.cpp>
    +<../../../firmware/common/proto/crc16.cpp>
