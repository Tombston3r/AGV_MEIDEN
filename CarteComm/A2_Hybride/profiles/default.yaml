    X96: 12
    X97: 13
    XA0: 14
    XA1: 15
    XA2: 16
    XA3: 17
    XA4: 18
    XA5: 19
    XA6: 20
    XA7: 21
  y:
    Y03: 0
    Y05: 1
    Y10: 2
    Y11: 3
    Y12: 4
    Y13: 5
    Y14: 6
    Y15: 7
    Y20: 8
