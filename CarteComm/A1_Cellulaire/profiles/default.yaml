# Profil matériel / applicatif — SOURCE DE VÉRITÉ UNIQUE
#
# Ce fichier est converti en en-tête C++ par tools/genconfig.py :
#   python3 tools/genconfig.py profiles/default.yaml \
#           firmware/common/config/generated_profile.h
#
# RÈGLE ABSOLUE (brief §3.2) : aucune de ces valeurs ne doit apparaître en dur
# dans le code. Toute valeur marquée PROVISOIRE §12 attend un relevé sur la
# carte d'origine AIO AGV Control V5.0.1.

profile_name: default

bus:
  # §12.3 — logique de l'automate PNP ou NPN, non tranchée.
  # true  : un 1 logique applicatif => ligne X à l'état haut.
  # false : polarité inversée sur les 22 voies X.
  x_active_high: true          # PROVISOIRE §12.3
  y_active_high: true          # PROVISOIRE §12.3

  # §12.4 — temps de stabilisation du bus X avant le front montant de X93.
  t_setup_us: 200              # PROVISOIRE §12.4
  # Largeur du strobe X93 et du front X82 / X83.
  t_strobe_us: 500             # PROVISOIRE §12.4
  t_hold_us: 100               # PROVISOIRE §12.4

  # §12.1 — amplitude réelle des lignes Y inconnue (6 V ou 24 V) : conditionne
  # le temps de debounce à appliquer sur les entrées.
  y_debounce_us: 2000          # PROVISOIRE §12.1

  # §12.10 — variante d'interface retenue : mcp23017 | shift595 | mega_uart | sim
  driver_variant: sim

  # Décalage résiduel documenté entre GPIOA et GPIOB (variante MCP23017).
  mcp_ab_skew_us: 25           # PROVISOIRE §12.10
  i2c_freq_hz: 400000
  spi_freq_hz: 8000000

timeouts:
  # §12.5 — timeouts des accusés, à relever à l'oscilloscope, pas à deviner.
  y22_write_ack_ms: 300        # PROVISOIRE §12.5
  y05_start_ack_ms: 1500       # PROVISOIRE §12.5
  y10_arrival_ms: 120000       # PROVISOIRE §12.5
  write_max_tries: 3           # PROVISOIRE §12.5
  start_max_tries: 3           # PROVISOIRE §12.5
  stop_max_tries: 3            # PROVISOIRE §12.5

safety:
  # Chien de garde applicatif : absence de trame valide pendant N secondes
  # => état sûr + LED FAULT. Paramètre, jamais une constante (brief §3.1).
  link_watchdog_s: 30
  # Une commande plus vieille que cette valeur n'est jamais exécutée (§8.1).
  max_command_age_s: 15
  # Arrêt sûr au point d'arrêt suivant en cas de perte de liaison.
  safe_stop_at_next_station: true

queue:
  max_courses: 5
  # Une course persistée plus vieille que ce délai est écartée au boot (§4.5).
  course_validity_min: 30
  persist_to_nvs: true

protocol:
  version: 1
  node_id: 1
  replay_window: 16            # 16 derniers (node_id, seq) mémorisés (§5.1)
  aes_enabled: true

enocean:
  # PTM 210 : 3 sous-télégrammes identiques par appui.
  dedup_window_ms: 100
  # TCM 515 = réception seule : aucun retour visuel possible vers le bouton.
  # Passer à false impose un TCM 310 (bidirectionnel). PROVISOIRE §12.8.
  rx_only: true
  pairing_mode_timeout_s: 60
  max_pairings: 32

cellular:
  apn: "m2m.internet"
  sim_pin: ""
  # Numéro du pair (poste fixe vu de l'AGV, et inversement) — variante SMS.
  peer_msisdn: "+33600000000"   # PROVISOIRE — SIM M2M non commandée
  # Numéro du technicien de maintenance hors site (AlertGateway, §8.3).
  alert_msisdn: "+33600000000"  # PROVISOIRE — à fournir par le client
  alerts_per_day_max: 6
  pwrkey_on_ms: 1000
  pwrkey_off_ms: 2500
  at_timeout_ms: 5000
  modem_mute_timeout_ms: 20000
  mqtt_host: "mqtt.example.lan"
  mqtt_port: 8883
  mqtt_qos: 1
  mqtt_keepalive_s: 60
  mqtt_client_id: "agv-1"

maintenance:
  # Wi-Fi de maintenance désactivé par défaut (§9.4).
  wifi_enabled_at_boot: false
  wifi_window_s: 600
  wifi_ssid: "AGV-MAINT"

# §12.2 — brochage des SUB-D 25 non tranché (CN61/62/63 vs CN62/63/64).
# Le mapping signal -> broche vit ici et nulle part ailleurs.
pinmap:
  # Bus X, 22 sorties. Index = position dans le mot 32 bits writeX().
  # Voir docs/signal_map.md pour la correspondance avec les repères sérigraphiés.
  x:
    X82: 0
    X83: 1
    X84: 2
    X85: 3
    X86: 4
    X87: 5
    X90: 6
    X91: 7
    X92: 8
    X93: 9
    X94: 10
    X95: 11
    X96: 12
    X97: 13
    XA0: 14
    XA1: 15
    XA2: 16
    XA3: 17
    XA4: 18
    XA5: 19
    XA6: 20
    XA7: 21
  # Bus Y, 21 entrées.
  y:
    Y03: 0
    Y05: 1
    Y10: 2
    Y11: 3
    Y12: 4
    Y13: 5
    Y14: 6
    Y15: 7
    Y20: 8
    Y21: 9
    Y22: 10
    Y23: 11
    Y24: 12
    Y25: 13
    Y26: 14
    Y27: 15
    Y30: 16
    Y31: 17
    Y32: 18
    Y33: 19
    Y34: 20
