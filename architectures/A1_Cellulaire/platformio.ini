; Architecture SMS + EnOcean — cibles embarquées.
;
; Dossier autonome : il se construit sans rien emprunter aux autres dossiers
; d'architecture de .
;
; Toolchain : PlatformIO + ESP-IDF (brief §2). Le framework Arduino n'est
; toléré que pour /firmware/mega-bridge.
;
; Les tests natifs ne passent PAS par PlatformIO : `make test` à la racine
; compile /common, /sim et /test avec un simple g++ (voir Makefile).
;
; Avant tout build : régénérer l'en-tête de configuration depuis le profil.
;   python3 tools/genconfig.py profiles/default.yaml \
;           firmware/common/config/generated_profile.h

[platformio]
default_envs = agv

[common]
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -Werror
    -I firmware/common
build_unflags = -std=gnu++11
extra_scripts = pre:tools/pio_genconfig.py

; --- AGV : cœur du projet --------------------------------------------------
[env:agv]
platform = espressif32
board = esp32dev
framework = espidf
build_flags =
    ${common.build_flags}
    -I firmware/agv/src
    -D TRANSPORT_MQTT_LTE
build_unflags = ${common.build_unflags}
extra_scripts = ${common.extra_scripts}
build_src_filter =
    +<firmware/agv/src/*>
    +<firmware/common/*>
    -<firmware/common/platform/*>
    +<firmware/common/platform/esp32/*>
monitor_speed = 115200

; Variante SMS de l'AGV. À n'utiliser que pour la comparaison demandée par le
; client : le SMS n'offre ni latence bornée ni ordre de remise (Archi_2 §3.2).
[env:agv-sms]
extends = env:agv
build_flags =
    ${common.build_flags}
    -I firmware/agv/src
    -D TRANSPORT_SMS

; --- Poste fixe ESP32 : EnOcean + modem cellulaire -------------------------
[env:poste]
platform = espressif32
board = esp32dev
framework = espidf
build_flags =
    ${common.build_flags}
    -I firmware/poste-esp32/src
    -D TRANSPORT_MQTT_LTE
build_unflags = ${common.build_unflags}
extra_scripts = ${common.extra_scripts}
build_src_filter =
    +<firmware/poste-esp32/src/*>
    +<firmware/common/*>
    -<firmware/common/platform/*>
    +<firmware/common/platform/esp32/*>
board_build.filesystem = littlefs
monitor_speed = 115200

; Variante SMS du poste (comparaison seulement).
[env:poste-sms]
extends = env:poste
build_flags =
    ${common.build_flags}
    -I firmware/poste-esp32/src
    -D TRANSPORT_SMS

; --- Pont ATmega2560 (variante C du §4.4) ----------------------------------
[env:mega-bridge]
platform = atmelavr
board = megaatmega2560
framework = arduino
build_src_filter = +<firmware/mega-bridge/src/*>
monitor_speed = 500000
