; Banc d'essai de l'API planning sur la carte (ESP32 de l'AGV Control V5.0.1).
;
; Toolchain : PlatformIO + ESP-IDF, comme les dossiers d'architecture.
;
; Le serveur n'est PAS recopié ici : `build_src_filter` va chercher
; ../serveur.cpp et le moteur. Une copie dériverait, et le banc ne prouverait
; plus rien sur le code qui tourne vraiment.
;
; Avant tout build, régénérer les pages embarquées si `web/` a changé :
;   python3 ../../../outils/embarquer_web.py

[env:banc]
platform = espressif32
board = esp32dev
framework = espidf
monitor_speed = 115200
upload_port = /dev/ttyUSB0
monitor_port = /dev/ttyUSB0

build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -Werror
    -I ../..
    -I ../../banc_api/esp32/src
build_unflags = -std=gnu++11

build_src_filter =
    +<*>
    +<../../serveur.cpp>
    +<../../../moteur/*.cpp>
    +<../../../atelier/agvdump.cpp>
