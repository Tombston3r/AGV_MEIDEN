; Monorepo AGV MEIDEN — cibles embarquées.
;
; Toolchain : PlatformIO + ESP-IDF (brief §2). Le framework Arduino n'est
; toléré que pour /firmware/bouton-lora et /firmware/mega-bridge.
;
; Les tests natifs ne passent PAS par PlatformIO : `make test` à la racine
; compile /common, /sim et /test avec un simple g++ (voir Makefile).
;
; Avant tout build : régénérer l'en-tête de configuration depuis le profil.
;   python3 tools/genconfig.py profiles/default.yaml \
;           firmware/common/config/generated_profile.h

[platformio]
default_envs = agv

[common]
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -Werror
    -I firmware/common
build_unflags = -std=gnu++11
extra_scripts = pre:tools/pio_genconfig.py

; --- AGV : cœur du projet --------------------------------------------------
[env:agv]
platform = espressif32
board = esp32dev
framework = espidf
build_flags =
    ${common.build_flags}
    -I firmware/agv/src
    -D TRANSPORT_LORA
build_unflags = ${common.build_unflags}
extra_scripts = ${common.extra_scripts}
build_src_filter =
    +<firmware/agv/src/*>
    +<firmware/common/*>
    -<firmware/common/platform/*>
    +<firmware/common/platform/esp32/*>
monitor_speed = 115200

; Variante cellulaire de l'AGV (A2). À n'utiliser que si le client impose le
; cellulaire — et alors en MQTT/LTE-M, jamais en SMS (Archi_2 §8).
[env:agv-lte]
extends = env:agv
build_flags =
    ${common.build_flags}
    -I firmware/agv/src
    -D TRANSPORT_MQTT_LTE

; --- Poste fixe ESP32 (A1 / A3) --------------------------------------------
[env:poste]
platform = espressif32
board = esp32dev
framework = espidf
build_flags =
    ${common.build_flags}
    -I firmware/poste-esp32/src
    -D TRANSPORT_LORA
build_unflags = ${common.build_unflags}
extra_scripts = ${common.extra_scripts}
build_src_filter =
    +<firmware/poste-esp32/src/*>
    +<firmware/common/*>
    -<firmware/common/platform/*>
    +<firmware/common/platform/esp32/*>
board_build.filesystem = littlefs
monitor_speed = 115200

; --- Nœud bouton sur pile (A1) — Arduino toléré ----------------------------
[env:bouton]
platform = espressif32
board = esp32dev
framework = arduino
build_flags =
    ${common.build_flags}
    -I firmware/bouton-lora/src
build_unflags = ${common.build_unflags}
extra_scripts = ${common.extra_scripts}
build_src_filter =
    +<firmware/bouton-lora/src/*>
    +<firmware/common/proto/*>
    +<firmware/common/config/*>

; --- Pont ATmega2560 (variante C du §4.4) ----------------------------------
[env:mega-bridge]
platform = atmelavr
board = megaatmega2560
framework = arduino
build_src_filter = +<firmware/mega-bridge/src/*>
monitor_speed = 500000
