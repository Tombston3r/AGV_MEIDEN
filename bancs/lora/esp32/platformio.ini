; Essais radio LoRa sur ESP32 — deux environnements, un par sens.
;
;   pio run -e tx -t upload -t monitor     émission + attente d'accusé
;   pio run -e rx -t upload -t monitor     écoute + accusé
;
; Les deux essais utilisent le PILOTE DU PROJET (`Sx1276Radio`) et la TRAME DU
; PROJET, pas une bibliothèque tierce. C'est ce qui leur donne leur valeur :
; ils éprouvent le code qui partira en production, et ils interopèrent avec
; ../unipi/ qui parle la même trame.
;
; Les essais compilent le PILOTE ET LA TRAME DU PROJET, empruntés à
; architectures/A3_LoRa/, et non une bibliothèque tierce : c'est ce qui leur
; donne leur valeur. Ils éprouvent le code qui partira en production.
;
; A2_Hybride porte les mêmes sources ; A3_LoRa est pris par convention.
[env]
platform = espressif32
board = esp32dev
framework = espidf
monitor_speed = 115200
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -I include
    -I ../../../architectures/A3_LoRa/firmware/common
build_unflags = -std=gnu++11

[env:tx]
build_src_filter =
    +<test_tx.cpp>
    +<../../../../architectures/A3_LoRa/firmware/common/platform/esp32/sx1276_radio.cpp>
    +<../../../../architectures/A3_LoRa/firmware/common/transport/duty_cycle.cpp>
    +<../../../../architectures/A3_LoRa/firmware/common/platform/esp32/esp_ports.cpp>
    +<../../../../architectures/A3_LoRa/firmware/common/proto/frame.cpp>
    +<../../../../architectures/A3_LoRa/firmware/common/proto/crc16.cpp>

[env:rx]
build_src_filter =
    +<test_rx.cpp>
    +<../../../../architectures/A3_LoRa/firmware/common/platform/esp32/sx1276_radio.cpp>
    +<../../../../architectures/A3_LoRa/firmware/common/transport/duty_cycle.cpp>
    +<../../../../architectures/A3_LoRa/firmware/common/platform/esp32/esp_ports.cpp>
    +<../../../../architectures/A3_LoRa/firmware/common/proto/frame.cpp>
    +<../../../../architectures/A3_LoRa/firmware/common/proto/crc16.cpp>
