; Essais radio LoRa sur ESP32 : deux cartes, deux sens.
;
;   pio run -e v6_tx    -t upload -t monitor     carte V6.0, émission
;   pio run -e v6_rx    -t upload -t monitor     carte V6.0, écoute
;   pio run -e tbeam_tx -t upload -t monitor     LILYGO T-Beam, émission
;   pio run -e tbeam_rx -t upload -t monitor     LILYGO T-Beam, écoute
;
; La T-Beam porte le MÊME SX1276 que le RFM95W de la carte V6.0 : seul le
; brochage change, et sa radio doit d'abord être mise sous tension par le
; gestionnaire AXP192 : voir src/tbeam_power.h.
;
; Les essais compilent le PILOTE ET LA TRAME DU PROJET, empruntés à
; architectures/A3_LoRa/, et non une bibliothèque tierce : c'est ce qui leur
; donne leur valeur. Ils éprouvent le code qui partira en production, et
; interopèrent avec ../linux/ qui parle la même trame.
;
; A2_Hybride porte les mêmes sources ; A3_LoRa est pris par convention.

[env]
platform = espressif32
board = esp32dev
framework = espidf
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -I include
    -I ../../../architectures/A3_LoRa/firmware/common

; Sources partagées par les quatre environnements. Le `+<test_*.cpp>` qui
; choisit le sens est ajouté par chaque environnement.
[commun]
sources =
    +<tbeam_power.cpp>
    +<oled.cpp>
    +<../../../../architectures/A3_LoRa/firmware/common/platform/esp32/sx1276_radio.cpp>
    +<../../../../architectures/A3_LoRa/firmware/common/transport/duty_cycle.cpp>
    +<../../../../architectures/A3_LoRa/firmware/common/platform/esp32/esp_ports.cpp>
    +<../../../../architectures/A3_LoRa/firmware/common/proto/frame.cpp>
    +<../../../../architectures/A3_LoRa/firmware/common/proto/crc16.cpp>

; --- Carte AIO AGV Control V6.0 -------------------------------------------
[env:v6_tx]
build_flags = ${env.build_flags} -D CARTE_V6
build_src_filter = +<test_tx.cpp> ${commun.sources}

[env:v6_rx]
build_flags = ${env.build_flags} -D CARTE_V6
build_src_filter = +<test_rx.cpp> ${commun.sources}

; --- LILYGO T-Beam v1.1 ----------------------------------------------------
[env:tbeam_tx]
build_flags = ${env.build_flags} -D CARTE_TBEAM
build_src_filter = +<test_tx.cpp> ${commun.sources}

[env:tbeam_rx]
build_flags = ${env.build_flags} -D CARTE_TBEAM
build_src_filter = +<test_rx.cpp> ${commun.sources}
