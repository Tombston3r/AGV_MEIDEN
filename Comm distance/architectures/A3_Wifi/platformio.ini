; Architecture Wi-Fi : carte AIO AGV Control V5.0.1 CONSERVÉE.
;
; Deux firmwares réécrits, sur la même carte :
;   pio run -e esp32   client Wi-Fi + MQTT + heartbeat + /agvdump
;   pio run -e mega    séquenceur X/Y + file de courses + repli de sécurité
;
; Le firmware d'origine n'est disponible ni en sources ni en binaire garanti
; (planification 0.5) : ces deux programmes sont écrits à partir du
; comportement documenté du bus MEIDEN, pas d'une rétro-ingénierie.
;
; Les tests natifs ne passent PAS par PlatformIO : `make test` compile
; /firmware/common, /sim et /test avec un simple g++ (voir Makefile).

[platformio]
default_envs = esp32, mega

[common]
build_flags =
    -Wall
    -Wextra
    -Werror
    -I firmware/common
extra_scripts = pre:tools/pio_genconfig.py

; --- ESP32 de la carte : passerelle Wi-Fi/MQTT -----------------------------
[env:esp32]
platform = espressif32
board = esp32dev
framework = espidf
build_flags =
    ${common.build_flags}
    -std=gnu++17
    -I firmware/esp32/src
build_unflags = -std=gnu++11
extra_scripts = ${common.extra_scripts}
build_src_filter =
    +<firmware/esp32/src/*>
    +<firmware/common/app/*>
    +<firmware/common/link/*>
    +<firmware/common/proto/*>
    +<firmware/common/config/*>
    +<firmware/common/platform/esp32/*>
monitor_speed = 115200

; --- ATmega2560 de la carte : séquenceur et file ---------------------------
;
; Le cœur métier (séquenceur, file, protocole) compile TEL QUEL pour l'AVR :
; c'est ce qui permet de le tester en natif contre le simulateur avant de le
; flasher sur un microcontrôleur qu'on ne peut pas déboguer facilement.
[env:mega]
platform = atmelavr
board = megaatmega2560
framework = arduino
build_flags =
    ${common.build_flags}
    -std=gnu++17
    -I firmware/mega/src
    -Os
build_unflags = -std=gnu++11
extra_scripts = ${common.extra_scripts}
build_src_filter =
    +<firmware/mega/src/*>
    +<firmware/common/app/course_queue.cpp>
    +<firmware/common/app/mega_app.cpp>
    +<firmware/common/app/persistent_store.cpp>
    +<firmware/common/app/sequencer.cpp>
    +<firmware/common/bus/avr_port_bus.cpp>
    +<firmware/common/config/hardware_profile.cpp>
    +<firmware/common/link/link_protocol.cpp>
    +<firmware/common/proto/crc16.cpp>
monitor_speed = 115200
